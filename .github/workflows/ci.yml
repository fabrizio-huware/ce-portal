name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ceportal
          POSTGRES_PASSWORD: ceportal
          POSTGRES_DB: ceportal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ceportal"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ceportal:ceportal@localhost:5432/ceportal_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # I tipi TypeScript dell'API sono generati dal backend: devono essere sempre aggiornati.
  api-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e backend
      - name: Lo schema dell'API è aggiornato
        working-directory: backend
        run: |
          python -c "import json; from app.main import app; json.dump(app.openapi(), open('/tmp/openapi.json','w'), indent=1, ensure_ascii=False)"
          diff /tmp/openapi.json ../frontend/openapi.json || { echo "::error::frontend/openapi.json non è aggiornato: esegui 'make api-types'"; exit 1; }
      - name: I tipi TypeScript sono aggiornati
        working-directory: frontend
        run: |
          npm ci
          npx openapi-typescript openapi.json -o /tmp/schema.d.ts
          diff /tmp/schema.d.ts src/api/schema.d.ts || { echo "::error::src/api/schema.d.ts non è aggiornato: esegui 'make api-types'"; exit 1; }

  # Test nel browser: backend vero, database vero, dati di esempio.
  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ceportal
          POSTGRES_PASSWORD: ceportal
          POSTGRES_DB: ceportal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ceportal"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ceportal:ceportal@localhost:5432/ceportal
      APP_ENV: local
      BOOTSTRAP_ADMIN_EMAIL: admin@huware.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e backend
      - name: Database e backend
        working-directory: backend
        run: |
          alembic upgrade head
          python -m app.db.seed
          nohup uvicorn app.main:app --port 8000 > /tmp/backend.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://localhost:8000/api/v1/health && break; sleep 1; done
          python scripts/seed_demo.py
      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          nohup npm run preview -- --host 127.0.0.1 > /tmp/preview.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ && break; sleep 1; done
      - name: Test nel browser
        working-directory: frontend
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-risultati
          path: |
            frontend/test-results
            /tmp/backend.log

  # L'immagine di produzione deve costruirsi e avviarsi: lo si prova a ogni modifica, prima di pubblicare.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Costruzione dell'immagine
        run: docker build -t ce-portal:ci .
      - name: "Avvio in modalità produzione (senza database: bastano i controlli di fumo)"
        run: |
          docker run -d --name ce-prod -p 8080:8080 \
            -e APP_ENV=prod -e JWT_SECRET="$(openssl rand -hex 32)" \
            -e MAIL_BACKEND=console -e GOOGLE_OAUTH_CLIENT_ID=ci.apps.googleusercontent.com \
            ce-portal:ci
          infra/scripts/smoke.sh http://localhost:8080 --prod
      - name: Avvio in modalità locale
        run: |
          docker rm -f ce-prod
          docker run -d --name ce-local -p 8080:8080 -e APP_ENV=local ce-portal:ci
          infra/scripts/smoke.sh http://localhost:8080
      - name: Log del contenitore in caso di errore
        if: failure()
        run: docker logs ce-prod || true; docker logs ce-local || true
