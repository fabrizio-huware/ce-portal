# Database PostgreSQL per sviluppo locale
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ceportal
      POSTGRES_PASSWORD: ceportal
      POSTGRES_DB: ceportal
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/local-db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ceportal"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
