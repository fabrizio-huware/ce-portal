[project]
name = "ce-portal-backend"
version = "0.1.0"
description = "API del portale Conti Economici di progetto"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.7",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "google-auth>=2.30",
  "requests>=2.32",
  "PyJWT>=2.9",
  "python-multipart>=0.0.9",
  "openpyxl>=3.1",
  "reportlab>=4.2",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.6",
  "pypdf>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations/versions"]  # file generati da Alembic

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # nei test i dati di esempio possono essere lunghi
"app/notifications/templates.py" = ["E501"]  # HTML con stili in linea
"app/exports/xlsx_export.py" = ["E501"]  # composizione dei fogli: tabelle di layout
"app/exports/pdf_export.py" = ["E501"]  # composizione delle pagine
"app/exports/dashboard_export.py" = ["E501"]  # tabelle di layout
"app/services/dashboards.py" = ["E501"]  # assemblaggio delle tabelle di sintesi
